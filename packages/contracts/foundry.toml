[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 128
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Backend integration tests deploy the real local venue (PoolManager fixture, adapter, swap router).
[profile.backend-fixture]
out = "out/backend-fixture"
cache_path = "cache/backend-fixture"
skip = ["**/test/**", "**/script/DeployXLayerTestnet.s.sol"]
