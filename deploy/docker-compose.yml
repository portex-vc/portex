# Portex testnet server (DigitalOcean): API + activity runner behind Caddy.
# Secrets live in /opt/portex/.env on the server, never in this repository.
name: portex

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: portex-server:latest
    restart: unless-stopped
    env_file: /opt/portex/.env
    environment:
      PORTEX_CHAIN_ID: "1952"
      PORT: "8790"
      DATABASE_PATH: /data/portex-1952.db
      PUBLIC_API_URL: https://testnet-api.portex.vc
      CORS_ORIGINS: https://testnet.portex.vc
      # X Layer's public RPC: 100-block log pages; its nodes can lag the head by a block or two.
      LOG_PAGE: "100"
      CONFIRMATIONS: "3"
      # The AI analyst reviews Stage 1 raises every 15 minutes (reports only: no attester key, so no on-chain vetoes).
      ANALYST_INTERVAL_MS: "900000"
    volumes:
      - /opt/portex/data/api:/data
    expose:
      - "8790"

  mock:
    # Opt-in: only one runner may drive the persona wallets. update.sh enables it when
    # /opt/portex/mock.enabled exists on the server.
    profiles: [mock]
    image: portex-server:latest
    depends_on:
      - api
    restart: unless-stopped
    env_file: /opt/portex/.env
    working_dir: /app
    command:
      - bun
      - --no-env-file
      - tools/mock/run.ts
      - --rpc
      - https://testrpc.xlayer.tech/terigon
      - --api
      - http://api:8790
      - --deployments
      - packages/contracts/deployments/1952-v31.json
    volumes:
      - /opt/portex/data/mock-state:/app/tools/mock/state

  tunnel:
    # Cloudflare Tunnel: the server dials out to Cloudflare, so no Cloudflare edge needs a route to this
    # host. Opt-in: update.sh enables it when /opt/portex/tunnel.enabled exists (TUNNEL_TOKEN in .env).
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    depends_on:
      - api
    env_file: /opt/portex/.env
    command: ["tunnel", "--no-autoupdate", "run"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/portex/certs:/certs:ro
      - caddy_data:/data

volumes:
  caddy_data: {}
