# Netlify builds this package (@portex/web, Next.js) for the X Layer testnet deployment.
# Monorepo: deploy with `netlify deploy --filter @portex/web`. The command and the publish
# path are resolved from the repository root.
[build]
  command = "cd apps/web && bun --no-env-file run sync-abi && npx next build"
  publish = "apps/web/.next"

[build.environment]
  NEXT_PUBLIC_CHAIN_ID = "1952"
  NEXT_PUBLIC_API_URL = "https://testnet-api.portex.vc"
  NODE_VERSION = "24"
  BUN_VERSION = "1.4.2"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
