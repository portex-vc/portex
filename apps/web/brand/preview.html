<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:-apple-system,system-ui;display:grid;grid-template-columns:1fr 1fr;height:100vh}
section{padding:40px;display:flex;flex-direction:column;gap:28px;align-items:flex-start}
.dark{background:#111214;color:#fff}.light{background:#fafafa;color:#111}
.row{display:flex;align-items:center;gap:24px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:10px;border:1px solid currentColor;opacity:.9;font:600 15px/1 system-ui}
</style></head><body>
<section class="dark">
  <img src="portex-logo.svg" style="height:56px;filter:invert(1)">
  <div class="row"><img src="portex-mark.svg" style="height:96px;filter:invert(1)"><img src="portex-mark.svg" style="height:48px;filter:invert(1)"><img src="portex-mark.svg" style="height:24px;filter:invert(1)"><img src="portex-mark.svg" style="height:16px;filter:invert(1)"></div>
  <img src="portex-wordmark.svg" style="height:28px;filter:invert(1)">
  <div class="chip"><img src="portex-mark.svg" style="height:18px;filter:invert(1)">Portex · dark theme</div>
  <img src="portex-logo-original.png" style="height:56px;border:1px dashed #555">
</section>
<section class="light">
  <img src="portex-logo.svg" style="height:56px">
  <div class="row"><img src="portex-mark.svg" style="height:96px"><img src="portex-mark.svg" style="height:48px"><img src="portex-mark.svg" style="height:24px"><img src="portex-mark.svg" style="height:16px"></div>
  <img src="portex-wordmark.svg" style="height:28px">
  <div class="chip"><img src="portex-mark.svg" style="height:18px">Portex · light theme</div>
</section></body></html>
